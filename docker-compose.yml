services:
  api:
    build: ./backend
    ports:
      - '8080:8000'
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      embeddings:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: ./backend
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4 -Q default,celery,attachments,search
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      embeddings:
        condition: service_healthy
    restart: unless-stopped

  # Search engine embeddings (slice 12): text-embeddings-inference serving
  # BAAI/bge-m3 on CPU. The model lives in the `embeddings_models` volume and
  # is never downloaded at startup (HF_HUB_OFFLINE) — fill it once, online,
  # with `make embeddings-fetch`. The tag is amd64-only; on an arm64 host set
  # EMBEDDINGS_IMAGE (e.g. a cpu-arm64 tag) or use the dev overlay's fake.
  embeddings:
    image: ${EMBEDDINGS_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.4}
    command: --model-id BAAI/bge-m3 --max-batch-tokens 16384
    environment:
      HF_HUB_OFFLINE: '1'
    volumes:
      - embeddings_models:/data
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:80/health']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  beat:
    build: ./backend
    command: celery -A app.tasks.celery_app beat --loglevel=info
    env_file: .env
    depends_on:
      - redis
    restart: unless-stopped

  bot:
    build: ./backend
    command: python run_bot.py
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - '8003:3000'
    depends_on:
      - api
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  embeddings_models:
