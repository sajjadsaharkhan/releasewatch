# Development overrides — mount source, enable hot reload, expose all ports.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  api:
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      ENVIRONMENT: development

  worker:
    volumes:
      - ./backend:/app
    environment:
      ENVIRONMENT: development

  beat:
    volumes:
      - ./backend:/app
    environment:
      ENVIRONMENT: development

  bot:
    volumes:
      - ./backend:/app
    environment:
      ENVIRONMENT: development

  frontend:
    build:
      context: ./frontend
      target: builder          # stop at the Node stage — skip nginx
    command: npm run dev -- --host 0.0.0.0
    ports:
      - '5173:5173'
    volumes:
      - ./frontend:/app
      - /app/node_modules      # preserve container's node_modules
    environment:
      VITE_API_TARGET: http://api:8000

  # The fake embedding endpoint (tests/fakes/embedding_endpoint.py) instead of
  # TEI + bge-m3: no 2 GB model download, runs on any CPU. Search works, with
  # trigram-hash "similarity" rather than real semantics. To use the real
  # model in dev, drop this override and run `make embeddings-fetch`.
  embeddings:
    image: releasewatch-embeddings-fake
    build: ./backend
    command: uvicorn tests.fakes.embedding_endpoint:app --host 0.0.0.0 --port 80
    environment: !reset {}
    volumes: !reset []
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:80/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
