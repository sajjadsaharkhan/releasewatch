name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Superseded runs on the same branch/PR are pointless — cancel them. Pushes to
# main/develop are left alone so an in-flight image publish is never aborted.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ── Change detection — skip halves of the pipeline that can't be affected ──
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      images: ${{ steps.images.outputs.matrix }}
      any-image: ${{ steps.images.outputs.any }}

    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'

      # Build the docker matrix from the filters so untouched images aren't rebuilt.
      - name: Compute image matrix
        id: images
        env:
          FRONTEND: ${{ steps.filter.outputs.frontend }}
          BACKEND: ${{ steps.filter.outputs.backend }}
        run: |
          matrix='[]'
          if [ "$BACKEND" = "true" ]; then
            matrix=$(echo "$matrix" | jq -c '. + [{"name":"api","context":"./backend"}]')
          fi
          if [ "$FRONTEND" = "true" ]; then
            matrix=$(echo "$matrix" | jq -c '. + [{"name":"frontend","context":"./frontend"}]')
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "any=$([ "$(echo "$matrix" | jq 'length')" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  # ── Frontend ──────────────────────────────────────────────────────────────
  frontend-build:
    name: Frontend — build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # ── Backend ───────────────────────────────────────────────────────────────
  # Verifies the Alembic head applies cleanly against a real Postgres.
  backend-migrations:
    name: Backend — migrations
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: releasewatch_test
          POSTGRES_USER: rw_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rw_user -d releasewatch_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SECRET_KEY: ci-secret-key-not-for-production
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: releasewatch_test
      POSTGRES_USER: rw_user
      POSTGRES_PASSWORD: test_password

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/pyproject.toml

      # Runtime deps only — the dev extra (pytest/mypy/ruff) isn't used here.
      - name: Install dependencies
        run: uv pip install --system -e .

      - name: Run migrations
        run: alembic upgrade head

  # ── Docker images — build & push to GHCR ──────────────────────────────────
  docker:
    name: Docker — ${{ matrix.image.name }}
    needs: [changes, frontend-build, backend-migrations]
    # Publish only on pushes, only for images whose source actually changed, and
    # only when no upstream job failed (skipped upstream jobs are fine).
    if: >-
      github.event_name != 'pull_request'
      && needs.changes.outputs.any-image == 'true'
      && !failure() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image.name }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
