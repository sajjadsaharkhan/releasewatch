# E2E stack overlay — an isolated Postgres/Redis + built frontend so Playwright
# can run against something close to production without touching `make dev`'s
# running containers or its data volumes.
#
# Usage: docker compose -f docker-compose.yml -f docker-compose.e2e.yml \
#          -p releasewatch-e2e up -d --build
# (or just `make e2e` / `make e2e-up`)
#
# List-valued keys (`ports`, `volumes`) merge by CONCATENATION across compose
# files, not replacement — `!override` is required wherever this file needs a
# different port/volume than docker-compose.yml, or both would apply and the
# inherited one (already bound by `make dev`'s running stack) wins the conflict.

services:
  api:
    ports: !override
      - '8081:8000'
    environment:
      POSTGRES_DB: releasewatch_e2e
      SECRET_KEY: e2e-fixed-secret-key-not-for-production
      TELEGRAM_BOT_TOKEN: ''
      ENVIRONMENT: test
      # Slice 14: the fake Jev below instead of api.typesafe.ai (A.12).
      JEV_BASE_URL: http://jev:80

  worker:
    environment:
      POSTGRES_DB: releasewatch_e2e
      SECRET_KEY: e2e-fixed-secret-key-not-for-production
      TELEGRAM_BOT_TOKEN: ''
      ENVIRONMENT: test
      JEV_BASE_URL: http://jev:80

  beat:
    environment:
      POSTGRES_DB: releasewatch_e2e
      SECRET_KEY: e2e-fixed-secret-key-not-for-production
      ENVIRONMENT: test

  # No bot token in E2E — Telegram sends are skipped app-side, and the bot's
  # long-poll loop has nothing to authenticate with, so it's left out of the
  # default `up` entirely rather than crash-looping on an empty token.
  bot:
    profiles: ['disabled']

  frontend:
    ports: !override
      - '8082:3000'

  # The fake embedding endpoint (tests/fakes/embedding_endpoint.py) instead of
  # TEI + bge-m3: no 2 GB model download, runs on any CPU. Search works, with
  # trigram-hash "similarity" rather than real semantics. To use the real
  # model in E2E, drop this override and run `make embeddings-fetch`.
  embeddings:
    image: releasewatch-embeddings-fake
    build: ./backend
    command: uvicorn tests.fakes.embedding_endpoint:app --host 0.0.0.0 --port 80
    environment: !reset {}
    volumes: !reset []
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:80/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  # The fake Jev (tests/fakes/jev_endpoint.py): every same-problem question is
  # answered "same", which is all the slice-14 scenarios script (A.12). Same
  # image as the fake embeddings (a full backend image, so tests.fakes is a
  # package in it) with the one file mounted and a different command — no
  # second image to build. The switch and key live in the DB; seed_e2e.py
  # turns them on against this URL.
  jev:
    image: releasewatch-embeddings-fake
    command: uvicorn tests.fakes.jev_endpoint:app --host 0.0.0.0 --port 80
    environment: !reset {}
    volumes:
      - ./backend/tests/fakes/jev_endpoint.py:/app/tests/fakes/jev_endpoint.py:ro
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:80/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  postgres:
    ports: !override
      - '5433:5432'
    environment:
      POSTGRES_DB: releasewatch_e2e
    volumes: !override
      - postgres_data_e2e:/var/lib/postgresql/data

  redis:
    ports: !override
      - '6380:6379'
    volumes: !override
      - redis_data_e2e:/data

volumes:
  postgres_data_e2e:
  redis_data_e2e:
